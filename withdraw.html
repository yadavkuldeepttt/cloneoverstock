<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Withdrawal</title>

    <style>
      :root {
        --red: #d60b1c;
        --red-700: #b00916;
        --bg: #e6f2f4;
        --panel: #ffffff;
        --text: #19212a;
        --muted: #6b7280;
        --border: #e6e7eb;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial,
          sans-serif;
        color: var(--text);
        background: var(--bg);
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .app {
        width: 375px;
        min-height: 667px;
        background: var(--panel);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      }

      .app-header {
        position: sticky;
        top: 0;
        z-index: 10;
        height: 56px;
        background: var(--red);
        color: #fff;
        display: grid;
        grid-template-columns: 56px 1fr 56px;
        align-items: center;
        padding: 0 8px;
      }

      .app-header .title {
        text-align: center;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.1em;
      }

      .icon-btn {
        background: transparent;
        border: 0;
        color: #fff;
        height: 40px;
        width: 40px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: background 0.2s;
      }

      .icon-btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .icon {
        font-size: 20px;
        font-weight: bold;
      }

      .content {
        padding: 0;
      }

      .withdrawable-card {
        background: var(--red);
        color: #fff;
        padding: 24px 20px;
        text-align: center;
      }

      .withdrawable-card.show {
        display: block;
      }

      .withdrawable-amount {
        font-size: 32px;
        font-weight: 700;
        margin-bottom: 8px;
      }

      .withdrawable-label {
        font-size: 14px;
        opacity: 0.9;
      }

      .account-info {
        background: #fff;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
      }

      .info-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 14px;
      }

      .info-row:last-child {
        margin-bottom: 0;
      }

      .info-label {
        color: var(--muted);
      }

      .info-value {
        color: var(--text);
        font-weight: 500;
      }

      .form-section {
        padding: 24px 20px;
      }

      .section-title {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.03em;
        margin: 0 0 16px;
        color: #333;
        text-transform: uppercase;
      }

      .input-group {
        margin-bottom: 20px;
      }

      .input-field {
        width: 100%;
        height: 52px;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0 16px;
        font-size: 14px;
        color: var(--text);
        background: #f9fafb;
        outline: none;
        transition: all 0.2s;
      }

      .input-field:focus {
        border-color: var(--red);
        background: #fff;
      }

      .input-field::placeholder {
        color: #9ca3af;
      }

      .primary-btn {
        width: 100%;
        height: 52px;
        border: 0;
        border-radius: 999px;
        background: var(--red);
        color: #fff;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.04em;
        box-shadow: 0 6px 12px rgba(217, 12, 28, 0.25);
        cursor: pointer;
        transition: all 0.2s;
        margin-top: 20px;
      }

      .primary-btn:hover {
        background: var(--red-700);
        transform: translateY(-1px);
        box-shadow: 0 8px 16px rgba(217, 12, 28, 0.3);
      }

      .primary-btn:active {
        transform: translateY(0);
      }

      .primary-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <a href="/profile.html" style="text-decoration: none">
          <button class="icon-btn" aria-label="Back">
            <span class="icon">‹</span>
          </button>
        </a>
        <h1 class="title">WITHDRAWAL</h1>
        <button class="icon-btn" aria-label="Help">
          <svg
            class="icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            style="width: 20px; height: 20px"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
            />
          </svg>
        </button>
      </header>

      <main class="content">
        <div class="withdrawable-card" id="withdrawableCard">
          <div class="withdrawable-amount" id="withdrawableAmount">$: 0.00</div>
          <div class="withdrawable-label">amount that can be withdrawn</div>
        </div>

        <div class="account-info">
          <div class="info-row">
            <span class="info-label">account name</span>
            <span class="info-value" id="accountName">Mobile number</span>
          </div>
          <div class="info-row">
            <span class="info-label"></span>
            <span class="info-value" id="mobileNumber">111****2</span>
          </div>
        </div>

        <form class="form-section" id="withdrawalForm">
          <h2 class="section-title">WITHDRAWAL AMOUNT</h2>

          <div class="input-group">
            <input
              type="number"
              class="input-field"
              id="withdrawalAmount"
              placeholder="$ Please enter the withdrawal amount"
              step="0.01"
              min="0"
              required
            />
          </div>

          <div class="input-group">
            <input
              type="password"
              class="input-field"
              id="loginPassword"
              placeholder="Enter login password"
              required
            />
          </div>

          <button type="submit" class="primary-btn" id="withdrawalBtn">
            WITHDRAWAL
          </button>
        </form>
      </main>
    </div>

    <script>
      // Load user data
      function loadUserData() {
        const tel = localStorage.getItem("tel") || "";
        const balance = localStorage.getItem("balance") || "0.00";

        if (tel) {
          const maskedTel = tel.replace(/(\d{3})\d{4}(\d{2})/, "$1****$2");
          document.getElementById("mobileNumber").textContent = maskedTel;
        }

        // Check if user has made a withdrawal before
        const hasWithdrawn = localStorage.getItem("has_withdrawn");
        if (hasWithdrawn === "true") {
          const withdrawableCard = document.getElementById("withdrawableCard");
          withdrawableCard.classList.add("show");

          console.log('====================================');
          console.log(balance);
          console.log('====================================');
          if (balance) {
            if (isNaN(balance)) balance = 0;
            document.getElementById("withdrawableAmount").textContent =
              "$: " + balance ;
          }
        }
      }

      // Initialize on page load
      loadUserData();

      document
        .getElementById("withdrawalForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const amount = document.getElementById("withdrawalAmount").value;
          const password = document.getElementById("loginPassword").value;
          const csrf_token = localStorage.getItem("csrf_token");

          if (!csrf_token) {
            alert("Please login first");
            window.location.href = "/login.html";
            return;
          }

          if (!amount || parseFloat(amount) <= 0) {
            alert("Please enter a valid withdrawal amount");
            return;
          }

          if (!password) {
            alert("Please enter your login password");
            return;
          }

          const withdrawalBtn = document.getElementById("withdrawalBtn");
          withdrawalBtn.disabled = true;
          withdrawalBtn.textContent = "PROCESSING...";

          try {
            const response = await fetch(
              "https://999.viptemugo.com/index/ctrl/do_deposit",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  _csrf_: csrf_token,
                  num: parseFloat(amount),
                  paypassword: password,
                  type: "USDT",
                }),
              }
            );

            const data = await response.json();

            if (data.code === 0) {
              // Mark that user has made a withdrawal
              localStorage.setItem("has_withdrawn", "true");

              // Update balance
              const currentBalance =
                parseFloat(localStorage.getItem("balance")) || 0;
              const newBalance = currentBalance - parseFloat(amount);
              localStorage.setItem("balance", newBalance.toFixed(2));

              alert("Member level withdrawal limit is20.00-1000000.00!");

              console.log(newBalance, "new balance");

              // Show withdrawable amount card
              const withdrawableCard =
                document.getElementById("withdrawableCard");
              withdrawableCard.classList.add("show");
              let balance = parseFloat(
                String(newBalance).replace(/[^0-9.-]/g, "")
              );
              if (isNaN(balance)) balance = 0;
              document.getElementById("withdrawableAmount").textContent =
                "$: " + balance;

              // Reset form
              document.getElementById("withdrawalForm").reset();
            } else {
              alert("Member level withdrawal limit is20.00-1000000.00!");
            }
          } catch (error) {
            console.error("Error:", error);
            alert("An error occurred. Please try again.");
          } finally {
            withdrawalBtn.disabled = false;
            withdrawalBtn.textContent = "WITHDRAWAL";
          }
        });
    </script>
  </body>
</html>
