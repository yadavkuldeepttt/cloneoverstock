<!DOCTYPE html>
<html lang="en" class="deeppurple-theme">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover, user-scalable=no"
    />
    <title>Order Management</title>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Roboto", sans-serif;
        padding-bottom: 130px;
      }
      .header {
        background: white;
        padding: 5px;
      }
      .header .material-icons {
        font-size: 24px;
      }
      .icon-slide {
        padding: 5px 0;
        overflow-x: auto;
        white-space: nowrap;
      }
      .icon-slide .btn {
        margin: 0 5px;
      }
      .btn-outline-default {
        background: red;
        color: white;
        border: none;
      }
      .btn-default {
        background: red;
        color: white;
        border: none;
      }
      .btn-cancel {
        background: #ccc;
        color: #333;
        border: none;
      }
      .btn-rounded {
        border-radius: 20px;
        padding: 8px 10px;
        font-size: 12px;
      }
      .card {
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
      }
      .card-header {
        background: white;
        border-bottom: 1px solid #f0f0f0;
      }
      .badge-warning {
        background: #ffc107;
        color: #333;
      }
      .badge-success {
        background: #28a745;
        color: white;
      }
      .badge-info {
        background: #17a2b8;
        color: white;
      }
      .icon-60 {
        width: 60px;
        height: 60px;
        border-radius: 8px;
        object-fit: cover;
      }
      .payment-all {
        position: fixed;
        bottom: 60px;
        left: 0;
        width: 100%;
        height: 60px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0px -3px 10px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(10px);
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 20px;
        z-index: 20;
      }
      .payment-time {
        position: fixed;
        bottom: 60px;
        left: 0;
        width: 100%;
        height: 42px;
        line-height: 42px;
        background: rgba(255, 243, 205, 0.95);
        box-shadow: 0px -3px 10px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(10px);
        padding: 0 20px;
        z-index: 19;
        font-size: 14px;
        font-weight: 500;
        color: #856404;
      }
      .footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 60px;
        background: white;
        box-shadow: 0px -3px 10px rgba(0, 0, 0, 0.1);
        display: flex;
        justify-content: space-around;
        align-items: center;
        z-index: 18;
      }
      .footer .btn-link {
        color: #999;
        text-decoration: none;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .footer .btn-link.active {
        color: red;
      }
      .modal-content {
        border-radius: 12px;
      }
      .star-rating {
        display: flex;
        gap: 3px;
      }
      .star-rating img {
        width: 18px;
        height: 18px;
        cursor: pointer;
      }
      .rating-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
        margin: 0 0 3px 0;
      }
      .rating-row span {
        font-size: 16px;
        color: #222;
      }
      #rating-notice {
        display: none;
        background-color: #fff3cd;
        border: 1px solid #ffeaa7;
        color: #856404;
        padding: 10px;
        margin: 0 25px 8px 25px;
        border-radius: 4px;
        font-size: 12px;
        text-align: center;
      }
      .product-info {
        padding: 20px;
        background: #f5f5f5;
        margin: 10px 0;
        text-align: center;
      }
      .product-info img {
        width: 120px;
        height: 120px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 10px;
      }
      .product-info p {
        font-size: 14px;
        color: #333;
        margin: 0;
        line-height: 1.4;
      }
      .loading {
        text-align: center;
        padding: 20px;
        color: #999;
      }

      .spinner-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }
      .spinner-container {
        background: white;
        padding: 30px;
        border-radius: 12px;
        text-align: center;
      }
      .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid red;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
        margin: 0 auto 15px;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .product_detail {
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="row no-gutters align-items-center">
        <div class="col-auto"></div>
        <div class="col text-center"></div>
        <div class="col-auto">
          <a href="/public/message.html" class="btn btn-link text-dark">
            <i class="material-icons">notifications_none</i>
          </a>
        </div>
      </div>
    </div>

    <div class="container mb-3">
      <div class="icon-slide">
        <a
          class="btn btn-sm btn-outline-default btn-rounded active"
          href="#"
          data-type="1"
          data-i18n="common.pending"
          >PENDING</a
        >
        <a
          class="btn btn-sm btn-rounded ml-1"
          href="#"
          data-type="2"
          data-i18n="common.freezing"
          >FREEZING</a
        >
        <a
          class="btn btn-sm btn-rounded ml-1"
          href="#"
          data-type="3"
          data-i18n="common.completed"
          >COMPLETED</a
        >
      </div>
    </div>

    <div class="container" id="orderList">
      <div class="loading" data-i18n="orderManage.loadingOrders">
        Loading orders...
      </div>
    </div>

    <div class="payment-all" id="paymentBar" style="display: none">
      <div>Total: <span id="totalPrice">$0</span></div>
      <div>
        <button
          class="btn btn-default shadow btn-rounded btn-sm"
          onclick="submitAllOrders()"
          data-i18n="orderManage.submitAll"
        >
          Submit All
        </button>
      </div>
    </div>

    <div class="payment-time" id="freezeTimer" style="display: none">
      <div>Payment Countdown: <span id="freeze_etime">00:00:00</span></div>
    </div>

    <div class="footer">
      <a href="/public/dashboard.html" class="btn btn-link-default active"
        ><img
          src="https://overstoc.cyou/red/fonts-google-svg/home_1.svg"
          style="width: 28px"
          class="icon"
      /></a>
      <a href="/public/news.html" class="btn btn-link-default"
        ><img
          src="https://overstoc.cyou/red/fonts-google-svg/local_mall_hs.svg"
          style="width: 28px"
          class="icon"
      /></a>
      <a href="/public/rot_order.html" class="btn btn-link-default"
        ><img
          src="https://overstoc.cyou/red/fonts-google-svg/electric_bolt_hs.svg"
          style="width: 28px"
          class="icon"
      /></a>
      <a href="/public/support.html" class="btn btn-link-default"
        ><img
          src="https://overstoc.cyou/red/fonts-google-svg/chat_hs.svg"
          style="width: 28px"
          class="icon"
      /></a>
      <a href="/public/profile.html" class="btn btn-link-default"
        ><img
          src="https://overstoc.cyou/red/fonts-google-svg/person_hs.svg"
          style="width: 28px"
          class="icon"
      /></a>
    </div>

    <!-- Loading Spinner Overlay -->
    <div class="spinner-overlay" id="loadingSpinner">
      <div class="spinner-container">
        <div class="spinner"></div>
        <p data-i18n="orderManage.processing">Processing order...</p>
      </div>
    </div>

    <!-- Order Detail Modal -->
    <div class="modal fade" id="orderDetail" tabindex="-1" role="dialog">
      <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
          <div class="modal-header border-0">
            <h5 data-i18n="orderManage.detailsTitle">Order Details</h5>
            <button type="button" class="close" data-dismiss="modal">
              <span>&times;</span>
            </button>
          </div>
          <div class="modal-body text-center" id="orderListInfo"></div>
          <div class="modal-footer border-0">
            <button
              class="btn btn-cancel btn-rounded mr-2"
              data-dismiss="modal"
              data-i18n="common.cancel"
            >
              Cancel
            </button>
            <button
              class="btn btn-default btn-rounded ml-2"
              onclick="proceedToRating()"
              data-i18n="common.submit"
            >
              Submit
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Rating Modal -->
    <div class="modal fade" id="ratingModal" tabindex="-1" role="dialog">
      <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
          <div class="modal-header border-0">
            <h5 data-i18n="orderManage.ratingTitle">Product Rating</h5>
            <button type="button" class="close" data-dismiss="modal">
              <span>&times;</span>
            </button>
          </div>
          <div class="modal-body text-center pt-0">
            <div class="product-info">
              <img id="rating-product-image" src="" alt="Product" />
              <p id="rating-product-name"></p>
            </div>
          </div>
          <div style="padding: 10px 25px">
            <div class="rating-row">
              <span data-i18n="orderManage.ratingDescriptionMatch"
                >Description Match</span
              >
              <div class="star-rating" id="description-stars"></div>
            </div>
            <div class="rating-row">
              <span data-i18n="orderManage.ratingLogisticsService"
                >Logistics Service</span
              >
              <div class="star-rating" id="logistics-stars"></div>
            </div>
            <div class="rating-row">
              <span data-i18n="orderManage.ratingServiceAttitude"
                >Service Attitude</span
              >
              <div class="star-rating" id="service-stars"></div>
            </div>
          </div>
          <div id="rating-notice" data-i18n="orderManage.ratingPleaseRateAll">
            Please rate all categories before submitting
          </div>
          <div class="modal-footer border-0">
            <button
              class="btn btn-cancel btn-rounded mr-2"
              data-dismiss="modal"
              data-i18n="common.cancel"
            >
              Cancel
            </button>
            <button
              class="btn btn-default btn-rounded ml-2"
              onclick="submitRating()"
              data-i18n="common.submit"
            >
              Submit
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="/public/i18n.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.bundle.min.js"></script>
    <script>
      const API_BASE_URL = "https://999.viptemugo.com";

      let currentOrderId = null;
      let currentOrderData = null;
      let currentPage = 1;
      let currentType = 1;
      let countdownInterval = null;
      let countdownEndTime = null;
      let ratings = {
        description: 0,
        logistics: 0,
        service: 0,
      };

      let orderTimers = {};

      const starDefault = "https://999.viptemugo.com/static_new6/img/star.png";
      const starActive =
        "https://999.viptemugo.com/static_new6/img/star-active.png";

      // Parse endtime string to timestamp
      function parseEndtime(endtimeStr) {
        // Format: "2025/10/06 11:51:23"
        const parts = endtimeStr.split(/[\/\s:]/);
        const year = parseInt(parts[0]);
        const month = parseInt(parts[1]) - 1;
        const day = parseInt(parts[2]);
        const hours = parseInt(parts[3]);
        const minutes = parseInt(parts[4]);
        const seconds = parseInt(parts[5]);

        return Math.floor(
          new Date(year, month, day, hours, minutes, seconds).getTime() / 1000
        );
      }

      // Start individual countdown timer for an order
      function startOrderTimer(orderId, endTime) {
        if (orderTimers[orderId]) {
          clearInterval(orderTimers[orderId]);
        }

        const endTimestamp =
          typeof endTime === "string"
            ? parseEndtime(endTime)
            : parseInt(endTime);

        orderTimers[orderId] = setInterval(function () {
          const now = Math.floor(Date.now() / 1000);
          const timeLeft = endTimestamp - now;

          const timerElement = $(`#timer-${orderId}`);

          if (timeLeft <= 0) {
            clearInterval(orderTimers[orderId]);
            timerElement.addClass("expired").text("⏰ Payment time expired");
            return;
          }

          const hours = Math.floor(timeLeft / 3600);
          const minutes = Math.floor((timeLeft % 3600) / 60);
          const seconds = timeLeft % 60;

          const timeString =
            String(hours).padStart(2, "0") +
            ":" +
            String(minutes).padStart(2, "0") +
            ":" +
            String(seconds).padStart(2, "0");

          timerElement.text(`⏰ Payment Countdown: ${timeString}`);
        }, 1000);
      }

      // Stop all timers
      function stopAllTimers() {
        Object.keys(orderTimers).forEach((orderId) => {
          clearInterval(orderTimers[orderId]);
        });
        orderTimers = {};
      }
      // Load orders from API
      function loadOrders(type = 1, page = 1) {
        currentType = type;
        currentPage = page;
        stopAllTimers();

        var user_id = localStorage.getItem("user_id");
        let csrf_token = localStorage.getItem("csrf_token");

        $.ajax({
          url: `${API_BASE_URL}/index/order/order_list`,
          method: "POST",
          data: {
            type: type,
            page: page,
            num: 10,
            user_id: user_id,
            __token__: csrf_token || "",
          },
          dataType: "json",
          success: function (response) {
            if (response.code === 0) {
              displayOrders(response.data);
            } else {
              $("#orderList").html(
                `<p class="text-center text-muted">${response.info}</p>`
              );
            }
          },
          error: function (xhr, status, error) {
            $("#orderList").html(
              '<p class="text-center text-danger">Failed to load orders. Please try again.</p>'
            );
            console.error("Error loading orders:", error);
          },
        });
      }
      // Display orders
      function displayOrders(orders) {
        if (!orders || orders.length === 0) {
          $("#orderList").html(
            '<p class="text-center text-muted">No orders found</p>'
          );
          $("#paymentBar").hide();
          return;
        }

        let html = "";
        let noPayCount = 0;
        let noPayPrice = 0;
        let noPayIds = [];

        orders.forEach((order) => {
          if (order.status === 0) {
            noPayCount++;
            noPayPrice += parseFloat(order.num);
            noPayIds.push(order.id);
          }

          const statusText =
            order.status === 0
              ? "PENDING"
              : order.status === 1
              ? "COMPLETED"
              : order.status === 5
              ? "FREEZING"
              : "UNKNOWN";

          const badgeClass =
            order.status === 0
              ? "badge-warning"
              : order.status === 1
              ? "badge-success"
              : "badge-info";

          html += `
            <div class="card mb-3">
              <div class="card-header bg-none">
                <div class="row">
                  <div class="col">
                    <p class="text-secondary small">${order.addtime}</p>
                  </div>
                  <div class="col-auto">
                    <p class="badge ${badgeClass}">${statusText}</p>
                  </div>
                </div>
              </div>
              <div class="card-body">
                <div class="media">
                  <img src="${
                    order.goods_pic
                  }" class="icon-60 mr-3" alt="Product">
                  <div class="media-body">
                    <p class="small mb-1"><strong>${
                      order.goods_name
                    }</strong></p>
                    <p class="small text-secondary mb-1">${order.shop_name}</p>
                    <p class="small text-secondary">Qty: ${
                      order.goods_count
                    }</p>
                  </div>
                </div>
                    ${
                      order.status === 0 && order.endtime
                        ? `
                  <div class="order-timer" id="timer-${order.id}">
                    ⏰ Payment Countdown: Calculating...
                  </div>
                `
                        : ""
                    }
              </div>
              <div class="card-footer">
                <div class="row">
                  <div class="col">
                    <p class="text-muted small">Total Amount:</p>
                    <p class="text-muted small">Commission:</p>
                  </div>
                  <div class="col-auto">
                    <p class="text-right"><strong>$${parseFloat(
                      order.num
                    ).toFixed(2)}</strong></p>
                    <p class="text-right text-success"><strong>$${parseFloat(
                      order.commission
                    ).toFixed(2)}</strong></p>
                  </div>
                </div>
  ${
    order.status === 0
      ? `
                  <div class="mt-2">
                    <button onclick="openRatingModal('${
                      order.id || order.oid
                    }')" class="btn btn-default shadow btn-rounded btn-block">Product Rating</button>
                  </div>
                `
      : ""
  }

              </div>
            </div>
          `;
        });

        $("#orderList").html(html);

        // Start timers for pending orders
        orders.forEach((order) => {
          if (order.status === 0 && order.endtime) {
            const orderId = order.id || order.oid;
            startOrderTimer(orderId, order.endtime);
          }
        });

        if (noPayCount > 0 && currentType === 1) {
          $("#totalPrice").text("$" + noPayPrice.toFixed(2));
          $("#paymentBar").show();
          $("#paymentBar").data("orderIds", noPayIds);
        } else {
          $("#paymentBar").hide();
        }
      }


      
      // Tab switching
      $(".icon-slide a").click(function (e) {
        e.preventDefault();
        $(".icon-slide a").removeClass("btn-outline-default active");
        $(this).addClass("btn-outline-default active");
        const type = $(this).data("type");
        loadOrders(type, 1);
      });
      // Submit single order - now opens rating modal directly
      function openRatingModal(id) {
        currentOrderId = id;

        var user_id = localStorage.getItem("user_id");
        let csrf_token = localStorage.getItem("csrf_token");

        showLoading();

        $.ajax({
          url: `${API_BASE_URL}/index/order/order_info`,
          method: "POST",
          data: {
            id: id,
            user_id: user_id,
            __token__: csrf_token || "",
          },
          dataType: "json",
          success: function (response) {
            hideLoading();

            if (response.code === 0) {
              currentOrderData = [response.data];
              showRatingModal();
            } else {
              console.error(response.info || "Failed to load order details");
            }
          },
          error: function () {
            hideLoading();
            console.error("Failed to load order details. Please try again.");
          },
        });
      }

      // Show loading spinner
      function showLoading() {
        $("#loadingSpinner").css("display", "flex");
      }

      // Hide loading spinner
      function hideLoading() {
        $("#loadingSpinner").hide();
      }

      // Submit single order
      function tijiao(id) {
        currentOrderId = id;

        var user_id = localStorage.getItem("user_id");
        let csrf_token = localStorage.getItem("csrf_token");

        $.ajax({
          url: `${API_BASE_URL}/index/order/order_info`,
          method: "POST",
          data: {
            id: id,
            user_id: user_id,
            __token__: csrf_token || "",
          },
          dataType: "json",
          success: function (response) {
            if (response.code === 0) {
              currentOrderData = [response.data];
              displayOrderDetail(response.data);
            } else {
              console.error(response.info || "Failed to load order details");
            }
          },
          error: function () {
            console.error("Failed to load order details. Please try again.");
          },
        });
      }

      // Display order detail
      function displayOrderDetail(order) {
        let html = `
          <div class="product-info">
            <img src="${order.goods_pic}" alt="Product">
            <p><strong>${order.goods_name}</strong></p>
            <p class="small text-secondary">${order.shop_name}</p>
          </div>
          <div class="text-left px-3">
            <div class="row mb-2">
              <div class="col">Quantity:</div>
              <div class="col-auto">${order.goods_count}</div>
            </div>
            <div class="row mb-2">
              <div class="col">Total Amount:</div>
              <div class="col-auto"><strong>$${parseFloat(order.num).toFixed(
                2
              )}</strong></div>
            </div>
            <div class="row mb-2">
              <div class="col">Commission:</div>
              <div class="col-auto text-success"><strong>$${parseFloat(
                order.commission
              ).toFixed(2)}</strong></div>
            </div>
            <div class="row mb-2">
              <div class="col">Expected Earnings:</div>
              <div class="col-auto text-primary"><strong>$${parseFloat(
                order.yuji
              ).toFixed(2)}</strong></div>
            </div>
          </div>
        `;
        $("#orderListInfo").html(html);
        $("#orderDetail").modal("show");
      }

      // Proceed to rating
      function proceedToRating() {
        $("#orderDetail").modal("hide");
        setTimeout(() => showRatingModal(), 300);
      }

      // Show rating modal
      function showRatingModal() {
        if (currentOrderData && currentOrderData.length > 0) {
          const order = currentOrderData[0];
          $("#rating-product-image").attr("src", order.goods_pic);
          $("#rating-product-name").text(order.goods_name);

          ["description", "logistics", "service"].forEach((category) => {
            let starsHtml = "";
            for (let i = 1; i <= 5; i++) {
              starsHtml += `<img src="${starDefault}" data-category="${category}" data-rating="${i}" onclick="setRating('${category}', ${i})">`;
            }
            $(`#${category}-stars`).html(starsHtml);
          });

          ratings = { description: 0, logistics: 0, service: 0 };
          $("#rating-notice").hide();
          $("#ratingModal").modal("show");
        }
      }

      // Set rating
      function setRating(category, rating) {
        ratings[category] = rating;
        const stars = $(`#${category}-stars img`);
        stars.each(function (index) {
          const starRating = parseInt($(this).data("rating"));
          $(this).attr("src", starRating <= rating ? starActive : starDefault);
        });
        $("#rating-notice").hide();
      }

      // Submit rating and order
      function submitRating() {
        if (
          ratings.description === 0 ||
          ratings.logistics === 0 ||
          ratings.service === 0
        ) {
          $("#rating-notice").show();
          return;
        }

        $("#ratingModal").modal("hide");

        showLoading();
        var user_id = localStorage.getItem("user_id");
        let csrf_token = localStorage.getItem("csrf_token");

        $.ajax({
          url: `${API_BASE_URL}/index/order/do_order`,
          method: "POST",
          data: {
            oid: currentOrderId,
            user_id: user_id,
            __token__: csrf_token || "",
          },
          dataType: "json",
          success: function (response) {
            
            if (response.code === 0) {
              // toastSuccess(response.info);
              setTimeout(() => {
                // Switch to "COMPLETED" tab after successful submission
                $(".icon-slide a").removeClass("btn-outline-default active");
                $(`.icon-slide a[data-type="3"]`).addClass(
                  "btn-outline-default active"
                );
                
                hideLoading(); // ✅ hide loading when done
                // Load completed orders (type = 3)
                loadOrders(3, 1);
              }, 3000);
            } else {
              console.error(response.info || "Failed to submit order");
            }
          },
          error: function () {
            hideLoading(); // ✅ also hide on error
            console.error("Failed to submit order. Please try again.");
          },
        });
      }

      // Submit all orders
      function submitAllOrders() {
        const orderIds = $("#paymentBar").data("orderIds");
        if (!orderIds || orderIds.length === 0) return;

        var user_id = localStorage.getItem("user_id");
        let csrf_token = localStorage.getItem("csrf_token");

        $.ajax({
          url: `${API_BASE_URL}/index/order/order_info_list`,
          method: "POST",
          data: {
            id: orderIds,
            user_id: user_id,
            __token__: csrf_token || "",
          },
          dataType: "json",
          success: function (response) {
            if (response.code === 0) {
              currentOrderData = response.data;
              currentOrderId = orderIds;

              let html = "";
              response.data.forEach((order) => {
                html += `
                  <div class="product-info">
                    <img src="${order.goods_pic}" alt="Product">
                    <p><strong>${order.goods_name}</strong></p>
                    <div class="product_detail">
                    <p class="small">Total Order: $${parseFloat(
                      order.num
                    ).toFixed(2)}</p>
                                        <p class="small">Commission: $${parseFloat(
                                          order.commission
                                        ).toFixed(2)}</p>
</div>
                  </div>
                `;
              });
              $("#orderListInfo").html(html);
              $("#orderDetail").modal("show");
            } else {
              console.error(response.info || "Failed to load orders");
            }
          },
          error: function () {
            console.error("Failed to load orders. Please try again.");
          },
        });
      }

      // Initialize
      $(document).ready(function () {
        loadOrders(1, 1);
      });
    </script>
  </body>
</html>
